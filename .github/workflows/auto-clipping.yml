
name: Auto AI Clipping

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube Video URL"
        required: true
        type: string

  repository_dispatch:
    types: [new_video]

permissions:
  contents: read

jobs:
  clipping:
    name: Generate YouTube Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Checkout original clipping project
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Install video-processing dependencies
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0

      # 4. Install the repository dependencies
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 5. Install JavaScript runtime for yt-dlp
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 6. Install latest yt-dlp and EJS support
      - name: Update YouTube Downloader
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          deno --version
          python -m yt_dlp --version

      # 7. Check the Gemini API key
      - name: Check Gemini API Key
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "ERROR: GOOGLE_API_KEY is missing"
            exit 1
          fi

          echo "Gemini API key configured"

      # 8. Check the YouTube URL
      - name: Validate YouTube URL
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.client_payload.source_url || inputs.video_url }}
        run: |
          if [ -z "$VIDEO_URL" ]; then
            echo "ERROR: YouTube URL is missing"
            exit 1
          fi

          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          url = os.environ["VIDEO_URL"]
          parsed = urlparse(url)

          allowed = {
              "youtube.com",
              "www.youtube.com",
              "m.youtube.com",
              "youtu.be"
          }

          if parsed.scheme != "https" or parsed.hostname not in allowed:
              sys.exit("Invalid YouTube URL")

          print("YouTube URL validated")
          PY

      # 9. Test YouTube access before processing
      - name: Test YouTube Video Access
        env:
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.client_payload.source_url || inputs.video_url }}
        run: |
          python -m yt_dlp \
            --skip-download \
            --no-playlist \
            --remote-components ejs:github \
            "$VIDEO_URL"

      # 10. Generate 3 Shorts using opensource-clipping
      - name: Generate 3 Shorts
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VIDEO_URL: ${{ github.event.client_payload.video_url || github.event.client_payload.source_url || inputs.video_url }}
          OMP_NUM_THREADS: "2"
        run: |
          python -u main.py \
            --source youtube \
            --url "$VIDEO_URL" \
            --clips 3 \
            --ratio 9:16 \
            --ai-provider gemini \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --whisper-model base \
            --render-height 720 \
            --no-bgm \
            --no-broll

      # 11. Upload generated videos
      - name: Upload Generated Shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: outputs/
          retention-days: 7
          if-no-files-found: warn
