
name: Auto AI Clipping

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive video link"
        required: true
        type: string

permissions:
  contents: read

jobs:
  clipping:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate 3 Shorts
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          python -u main.py \
            --source gdrive \
            --url "$VIDEO_URL" \
            --clips 3 \
            --ratio 9:16 \
            --ai-provider gemini \
            --whisper-device cpu \
            --whisper-compute-type int8 \
            --whisper-model base \
            --render-height 720 \
            --no-bgm \
            --no-broll

      - name: Save generated videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: outputs/
          retention-days: 7
          if-no-files-found: warn
